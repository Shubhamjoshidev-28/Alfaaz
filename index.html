<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="A personal, offline-first music player.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo/Alfaaz_logo.png">
<link rel="apple-touch-icon" href="assets/logo/Alfaaz_logo.png">
<title>Alfaaz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===================== MOBILE HEADER ===================== -->
  <header class="mobile-header">
    <div class="mobile-logo">
      <img class="mobile-logo-img" src="assets/logo/Alfaaz_logo.png" alt="Alfaaz">
    </div>
    <button id="mobileSearchBtn" class="btn-icon" aria-label="Search songs or artists">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- ===================== SIDEBAR ===================== -->
  <nav id="sidebar" class="sidebar" aria-label="Primary">
    <div class="sidebar-logo">
      <img id="logoImg" class="logo-img" src="assets/logo/Alfaaz_logo.png" alt="Home">
    </div>

    <div class="sidebar-nav">
      <button class="nav-item active" data-view="songs" aria-label="Songs">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        <span class="nav-label">Songs</span>
      </button>
      <button class="nav-item" data-view="artists" aria-label="Artists">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1-3.6 4-5.6 7.5-5.6s6.5 2 7.5 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="nav-label">Artists</span>
      </button>
      <button class="nav-item" data-view="downloads" aria-label="Downloads">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 17.5v2A1.5 1.5 0 006 21h12a1.5 1.5 0 001.5-1.5v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="nav-label">Downloads</span>
      </button>
      <button class="nav-item" data-view="settings" aria-label="Settings">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 00-1.7-1l-.3-2.5H9.9l-.3 2.5a7.7 7.7 0 00-1.7 1l-2.3-.9-2 3.4L5.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.75 1.7 1l.3 2.5h4.2l.3-2.5c.6-.25 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </span>
        <span class="nav-label">Settings</span>
      </button>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <main id="main">

    <!-- SONGS VIEW -->
    <section id="view-songs" class="view active">
      <header class="view-header">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="text" placeholder="Search songs or artists" autocomplete="off">
        </div>
        <button id="bulkUploadBtn" class="btn-ghost btn-with-icon" type="button">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>Bulk Upload</span>
        </button>
        <button id="addSongBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Add Song</span>
        </button>
      </header>
      <div id="songsStatus" class="status-area"></div>
      <div id="songsGrid" class="song-list"></div>
    </section>

    <!-- ARTISTS VIEW -->
    <section id="view-artists" class="view">
      <header class="view-header">
        <h2 class="view-title">Artists</h2>
      </header>
      <div id="artistsStatus" class="status-area"></div>
      <div id="artistsGrid" class="cards-grid artists-grid"></div>
    </section>

    <!-- ARTIST SONGS VIEW -->
    <section id="view-artist-songs" class="view">
      <header class="view-header">
        <button id="backFromArtist" class="btn-icon" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="artistSongsTitle" class="view-title"></h2>
      </header>
      <div id="artistSongsGrid" class="song-list"></div>
    </section>

    <!-- DOWNLOADS VIEW -->
    <section id="view-downloads" class="view">
      <header class="view-header">
        <h2 class="view-title">Downloads</h2>
      </header>
      <div id="downloadsStatus" class="status-area"></div>
      <div id="downloadsGrid" class="song-list"></div>
    </section>

    <!-- SETTINGS VIEW -->
    <section id="view-settings" class="view">
      <header class="view-header">
        <h2 class="view-title">Settings</h2>
      </header>
      <div class="settings-panel">
        <div class="settings-row">
          <div>
            <p class="settings-label">Connection</p>
            <p class="settings-sub" id="connectionStatus">Checking&hellip;</p>
          </div>
          <span id="connectionDot" class="status-dot"></span>
        </div>
        <div class="settings-row">
          <div>
            <p class="settings-label">Downloaded songs</p>
            <p class="settings-sub" id="downloadCount">0 songs stored offline</p>
          </div>
          <button id="clearDownloadsBtn" class="btn-ghost">Clear all</button>
        </div>
        <div class="settings-row">
          <div>
            <p class="settings-label">App</p>
            <p class="settings-sub">Offline-first personal player</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===================== SONG DETAIL ===================== -->
  <div id="songDetail" class="song-detail" aria-hidden="true">
    <div class="detail-scrim"></div>
    <div class="detail-panel">
      <button id="closeDetail" class="btn-icon detail-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <div class="detail-inner">
        <button id="detailCover" class="detail-cover" aria-label="Toggle lyrics">
          <div class="disc" id="detailDisc">
            <div class="disc-hole"></div>
          </div>
          <div class="cover-glow"></div>
        </button>

        <div id="lyricsPanel" class="lyrics-panel" aria-hidden="true">
          <div class="lyrics-scroll" id="lyricsScroll"></div>
        </div>

        <h2 id="detailTitle" class="detail-title">&nbsp;</h2>
        <p id="detailArtist" class="detail-artist">&nbsp;</p>

        <div class="seek-row">
          <span id="curTime" class="time-label">0:00</span>
          <input id="seekBar" class="seek-bar" type="range" min="0" max="100" value="0" step="0.1">
          <span id="durTime" class="time-label">0:00</span>
        </div>

        <div class="controls-row">
          <button id="shuffleBtn" class="btn-icon control-sm" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h3.5L16 18h5M3 18h3.5L14 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 6h3v3M18 18h3v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="prevBtn" class="btn-icon control-md" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM19 6L9 12l10 6z"/></svg>
          </button>
          <button id="playBtn" class="btn-primary control-lg" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button id="nextBtn" class="btn-icon control-md" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l10 6-10 6z"/></svg>
          </button>
          <button id="loopBtn" class="btn-icon control-sm" aria-label="Loop" title="Loop">
            <svg viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 014-4h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M7 22l-4-4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="detail-actions">
          <button id="volumeToggle" class="btn-icon" aria-label="Volume">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1">
          <span class="spacer"></span>
          <button id="detailDownloadBtn" class="btn-icon" aria-label="Download">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 17.5v2A1.5 1.5 0 006 21h12a1.5 1.5 0 001.5-1.5v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button id="detailEditBtn" class="btn-icon" aria-label="Edit">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
          <button id="detailDeleteBtn" class="btn-icon danger" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== MINI PLAYER ===================== -->
  <button id="miniPlayer" class="mini-player" aria-label="Open now playing">
    <div class="mini-cover" id="miniCover"></div>
    <div class="mini-meta">
      <p id="miniTitle" class="mini-title">&nbsp;</p>
      <p id="miniArtist" class="mini-artist">&nbsp;</p>
      <div class="mini-progress"><div id="miniProgressFill" class="mini-progress-fill"></div></div>
    </div>
    <span id="miniPrev" class="mini-btn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM19 6L9 12l10 6z"/></svg>
    </span>
    <span id="miniPlay" class="mini-btn mini-play" aria-label="Play/Pause">
      <svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg>
      <svg id="miniPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </span>
    <span id="miniNext" class="mini-btn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM5 6l10 6-10 6z"/></svg>
    </span>
  </button>

  <!-- ===================== ADD / EDIT MODAL ===================== -->
  <div id="songModal" class="modal-overlay" aria-hidden="true">
    <div class="modal">
      <h3 id="modalTitle" class="modal-title">Add Song</h3>
      <form id="songForm">
        <label class="field-label" for="fieldTitle">Title</label>
        <input id="fieldTitle" class="field-input" type="text" required placeholder="Song title">

        <label class="field-label" for="fieldArtist">Artist</label>
        <input id="fieldArtist" class="field-input" type="text" required placeholder="Artist name">

        <label class="field-label" for="fieldLyrics">Lyrics File</label>
        <input id="fieldLyrics" class="field-input field-file" type="file" accept=".txt,text/plain">
        <p id="lyricsFileHint" class="field-hint">.txt file (optional)</p>

        <label class="field-label" for="fieldAudio">Upload Audio</label>
        <input id="fieldAudio" class="field-input field-file" type="file" accept="audio/*">
        <p id="audioFileHint" class="field-hint">MP3, WAV or other audio file</p>

        <div id="modalError" class="modal-error" hidden></div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn-ghost">Cancel</button>
          <button type="submit" id="submitModalBtn" class="btn-primary">
            <span id="submitModalLabel">Add Song</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== BULK UPLOAD MODAL ===================== -->
  <div id="bulkUploadModal" class="modal-overlay" aria-hidden="true">
    <div class="modal bulk-modal">
      <h3 class="modal-title">Bulk Upload</h3>

      <div id="bulkDropzone" class="bulk-dropzone" tabindex="0" role="button" aria-label="Drop audio files here, or activate to choose files">
        <svg class="bulk-dropzone-icon" viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <p class="bulk-dropzone-title">Drop audio files here</p>
        <p class="bulk-dropzone-sub">or <span class="bulk-choose-link">choose files</span></p>
        <input id="bulkFileInput" class="visually-hidden" type="file" accept="audio/*" multiple tabindex="-1">
      </div>

      <div class="bulk-summary">
        <span id="bulkFileCount">Selected: 0 songs</span>
        <button type="button" id="bulkClearAllBtn" class="bulk-clear-link" hidden>Clear all</button>
      </div>

      <div id="bulkFileList" class="bulk-file-list" aria-live="polite"></div>

      <div id="bulkUploadError" class="modal-error" hidden></div>
      <div id="bulkUploadSuccess" class="modal-success" hidden></div>

      <div class="modal-actions">
        <button type="button" id="bulkCancelBtn" class="btn-ghost">Cancel</button>
        <button type="button" id="bulkUploadSubmitBtn" class="btn-primary" disabled>
          <span id="bulkUploadSubmitLabel">Upload Songs</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

</div>

<audio id="audioEl" preload="metadata"></audio>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
